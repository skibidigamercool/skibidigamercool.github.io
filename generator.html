  <script type="text/babel">
    function App() {
      const [status, setStatus] = React.useState("");

      const fakeGenerate = () => {
        const steps = [
          "Checking account eligibility…",
          "Verifying Robux balance…",
          "Applying potential bonus…",
          "Almost done…",
          "Looks like the generator didn't work, try again."
        ];

        let i = 0;
        setStatus("");

        const interval = setInterval(() => {
          setStatus(steps[i]);
          i++;
          if (i >= steps.length) clearInterval(interval);
        }, 700);
      };

      return (
        <>
          {/* The HTML for the navbar */}
          <header className="roblox-navbar">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Roblox_Logo_2022.svg"
              alt="Roblox"
              className="h-6"
            />
            <div className="nav-links d-none d-md-flex">
              <span>Discover</span>
              <span>Marketplace</span>
              <span>Create</span>
              <span>Robux</span>
            </div>
          </header>

          {}
          <div className="flex-1 flex items-center justify-center">
            <div className="w-full max-w-md px-3">

             

              {/* This basically is the stuff for the generator */}
              <div className="bg-rbPanel border border-rbBorder rounded-lg p-5 shadow-lg">
                <h1 className="fs-4 fw-bold mb-1 boldthingy text-center">
                  Robux Generator
                </h1>
                <p className="text-rbMuted text-sm mb-4 text-center">
               This generator may be shut off during certain times of day.
                </p>

                <label className="form-label fw-medium">Roblox Username</label>
                <input
                  placeholder="Enter username"
                  className="form-control mb-3 text-muted"
                />

                <label className="form-label fw-medium">Robux Amount</label>
                <select className="form-select mb-4 text-muted">
                  <option>1,000 Robux</option>
                  <option>10,000 Robux</option>
                  <option>1,000,000 Robux</option>
                </select>

                <button
                  onClick={fakeGenerate}
                  className="btn w-100 text-white fw-semibold"
                  style={{ backgroundColor: "#335fff" }}
                >
                  Generate Robux
                </button>

                {status && (
                  <div className="mt-3 text-sm text-rbMuted text-center animate-pulse">
                    {status}
                  </div>
                )}

                <div className="mt-4 pt-3 border-top text-xs text-rbMuted text-center">
This generator may not work at certain times of day.
                </div>
              </div>
           </div>
          </div>

          {/* Footer */}
          <footer className="text-center text-xs text-rbMuted py-4">
            Not explicitly affiliated with Roblox Corp.
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
